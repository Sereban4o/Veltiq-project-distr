; OPcache tuning for the Laravel app (php-fpm + cli).
; OPcache is compiled into the official php image (loaded by default), so this
; file only tunes it and defines the preload script.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=128M
; Preload a small, safe class set (see docker/preload.php).
opcache.preload=/var/www/html/docker/preload.php
opcache.preload_user=www-data
