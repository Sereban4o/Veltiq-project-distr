[www]
listen = 0.0.0.0:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
; Pass the container environment (docker compose env_file) through to the
; PHP workers. Without this the workers get an empty env and fall back to
; defaults such as DB_HOST=127.0.0.1, which breaks every HTTP request.
clear_env = no
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
