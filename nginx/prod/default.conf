# Upgrade handling for WebSocket proxying (canonical Reverb setup).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Mask query strings in access logs (ONLYOFFICE JWTs and download/callback
# tokens are passed as ?token=... query args).
log_format masked '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # Backend root (used only as a reference for the FastCGI snippet)
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100m;

    # Re-resolve upstream hostnames (app/reverb) via Docker's embedded DNS so
    # nginx does not keep a stale container IP after a recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/xml
        image/svg+xml;

    # ── Laravel API / backend routes (^~ prevents the SPA asset regex) ──────
    location ^~ /api/          { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /sanctum/      { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /broadcasting/ { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /storage/      { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /docs          { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /up            { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /_ignition     { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /admin         { include /etc/nginx/snippets/laravel.conf; }

    # ── Laravel Reverb WebSocket (ws://host/app/{key}) ──────────────────────
    location /app/ {
        set $upstream_reverb reverb:8080;
        proxy_pass http://$upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA static assets (hashed) ──────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── App updates (manifest + binaries) ──────────────────────────────────
    location ^~ /updates/ {
        root /var/www;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
    }

    # ── PWA: service worker must never be cached ────────────────────────────
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── ONLYOFFICE Document Server through the app origin ──────────────────
    # The editor loads api.js in the BROWSER, so the Document Server must be
    # reachable from the device that opened the app. Publishing it on a fixed
    # public IP:port breaks as soon as somebody opens the app via the LAN
    # address (a public IP is usually not routable from inside). Proxying it
    # under the app origin keeps LAN, public IP and domain access working.
    # Set ONLYOFFICE_URL=/onlyoffice in backend/.env.production.
    #
    # The upstream is resolved per request (variables + `resolver` above), so
    # nginx starts fine even when the onlyoffice overlay is not running.
    location ^~ /onlyoffice/ {
        set $upstream_onlyoffice onlyoffice:80;
        rewrite ^/onlyoffice/(.*)$ /$1 break;
        proxy_pass http://$upstream_onlyoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback (client-side routing) ──────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # index.html must never be cached: after a deploy it references new hashed
    # chunks, and a stale copy makes the browser request removed assets (→ HTML
    # fallback → "Expected a JavaScript module but got text/html").
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Deny hidden files ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
