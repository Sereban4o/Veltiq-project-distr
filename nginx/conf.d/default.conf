# Upgrade handling for WebSocket proxying (canonical Reverb setup).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Mask query strings in access logs (ONLYOFFICE JWTs and download/callback
# tokens are passed as ?token=... query args).
log_format masked '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 100m;

    # Re-resolve upstream hostnames (app/reverb) via Docker's embedded DNS so
    # nginx does not keep a stale container IP after a recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compression for API/HTML responses
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/xml
        image/svg+xml;

    # Long-lived static files (uploads, assets served from public/)
    # ── App updates (manifest + binaries) ──────────────────────────────────
    location ^~ /updates/ {
        root /var/www;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
    }

    # ── Reverb WebSocket ──────────────────────────────────────────────────
    # Proxy Pusher-style WebSocket connections to the Reverb server.
    # Clients connect to ws://host/app/{key} and the auth endpoint is
    # proxied to the Laravel app (handled by the php location block below).
    location /app/ {
        set $upstream_reverb reverb:8080;
        proxy_pass http://$upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Query strings are masked to keep JWTs out of access.log.
        access_log /var/log/nginx/access.log masked;
    }

    location ~ /\. {
        deny all;
    }
}
